{% extends "base.html" %}
{% block title %}Login — FinAgent{% endblock %}
{% block content %}
<div class="auth-card">
    <h1 class="auth-title">Log in</h1>
    <form method="post" class="auth-form">
        <label>Email
            <input type="email" name="email" class="search-input" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" class="search-input" required>
        </label>
        <button type="submit" class="btn-primary">Log in</button>
    </form>
    <p class="auth-switch">No account? <a href="/signup">Sign up</a></p>
</div>
{% endblock %}
