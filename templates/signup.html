{% extends "base.html" %}
{% block title %}Sign up — Finsight{% endblock %}
{% block content %}
<div class="auth-card">
    <h1 class="auth-title">Create an account</h1>
    <form method="post" class="auth-form">
        <label>Email
            <input type="email" name="email" class="search-input" required autofocus>
        </label>
        <label>Password
            <input type="password" name="password" class="search-input" required minlength="6">
        </label>
        <button type="submit" class="btn-primary">Sign up</button>
    </form>
    <p class="auth-switch">Already have an account? <a href="/login">Log in</a></p>
</div>
{% endblock %}
